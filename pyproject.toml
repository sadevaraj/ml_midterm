[project]
name = "ml-midterm"
version = "0.1.0"
description = "Machine learning midterm notebook project"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn==1.9.1; python_version >= '3.11'",
    "scikit-learn==1.7.2; python_version < '3.11'",
    "ipykernel",
    "matplotlib (<3.11)",
    "fastapi",
    "uvicorn[standard]",
]

[tool.poetry]
package-mode = false
